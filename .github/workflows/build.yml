# Builds the clock software whenever a new .ino is dropped into drop/, then publishes it
# (and the USB install page) on GitHub Pages. The clock picks it up from there by itself.
name: Build clock software

on:
  push:
    branches: [main]
    paths: ['drop/**', 'support/**', 'site/**', '.github/workflows/build.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # full history, to find the newest file in drop/

      - id: pages
        uses: actions/configure-pages@v5

      - uses: arduino/setup-arduino-cli@v2

      - name: Install the ESP32 board package and libraries
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.0.7
          arduino-cli lib install "GxEPD2@1.6.9" "ArduinoJson@7.4.2" "Adafruit GFX Library@1.12.6" "Adafruit BusIO@1.17.4"

      - name: Build
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
          ARDUINO_DATA: /home/runner/.arduino15
        run: bash support/build.sh

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      NTFY: ${{ secrets.NTFY_TOPIC }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Tell your phone
        if: ${{ env.NTFY != '' }}
        run: |
          curl -s -H "Title: New clock software published" -H "Tags: package" \
            -d "Version 5.${{ github.run_number }} is ready. The clock installs it tonight around 3 AM. To install now, send: update  to ${NTFY}-cmd" \
            "https://ntfy.sh/${NTFY}" > /dev/null
